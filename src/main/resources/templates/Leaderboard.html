<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Leaderboard: ${exam.title}|">Leaderboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --line: #d9deea;
            --gold: #b7791f;   --gold-bg: #fff6dd;
            --silver: #475467; --silver-bg: #eef1f6;
            --bronze: #9a5b2b; --bronze-bg: #fbeadb;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }
        h1, h2 { font-weight: 800; letter-spacing: -0.02em; }
        :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

        .page { padding: 1.5rem 0 2.5rem; }
        .narrow { max-width: 720px; margin-inline: auto; }

        .back-link a { color: var(--brand); font-weight: 600; text-decoration: none; display: inline-block; padding: .25rem 0; }
        .back-link a:hover { text-decoration: underline; }

        .page h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); margin: .5rem 0 .25rem; overflow-wrap: anywhere; }
        .page .sub { color: var(--muted); margin-bottom: 1.25rem; }

        .my-rank {
            background: var(--surface); border: 2px solid var(--brand); border-radius: 14px;
            padding: .8rem 1rem; margin-bottom: 1.25rem; font-weight: 600;
        }
        .my-rank strong { color: var(--brand); font-size: 1.25rem; }

        /* Podium: 2nd, 1st, 3rd left to right, 1st is tallest */
        .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; align-items: end; margin-bottom: 1.25rem; }
        .pod {
            border: 2px solid var(--ink); border-radius: 14px; padding: .75rem .4rem;
            text-align: center; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .15rem;
        }
        .pod.rank-1 { order: 2; min-height: 210px; background: var(--gold-bg);   border-color: var(--gold); }
        .pod.rank-2 { order: 1; min-height: 180px; background: var(--silver-bg); border-color: var(--silver); }
        .pod.rank-3 { order: 3; min-height: 160px; background: var(--bronze-bg); border-color: var(--bronze); }
        .pod.me { box-shadow: 0 0 0 3px var(--brand); }

        .medal { font-size: 1.6rem; line-height: 1; }
        .rank-1 .medal { color: var(--gold); }
        .rank-2 .medal { color: var(--silver); }
        .rank-3 .medal { color: var(--bronze); }
        .place { font-size: 1.6rem; font-weight: 800; line-height: 1; }
        .rank-1 .place { color: var(--gold); }
        .rank-2 .place { color: var(--silver); }
        .rank-3 .place { color: var(--bronze); }

        .avatar {
            flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 1px solid var(--line); background: var(--surface); color: var(--muted);
        }
        .pod-name { font-weight: 700; font-size: .9rem; line-height: 1.2; overflow-wrap: anywhere; margin-top: .25rem; }
        .pod-score { font-weight: 800; font-size: 1.05rem; margin-top: auto; }
        .pod-raw { color: var(--muted); font-size: .8rem; }

        /* Rank 4 and below */
        .rank-list { list-style: none; padding: 0; margin: 0; }
        .rank-row {
            display: flex; align-items: center; gap: .75rem;
            background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
            padding: .7rem .9rem; margin-bottom: .5rem; min-width: 0;
        }
        .rank-row.me { border: 2px solid var(--brand); background: #eef0ff; }
        .rank-no { flex: none; width: 2rem; text-align: center; font-weight: 800; color: var(--muted); }
        .rank-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
        .you { display: inline-block; background: var(--brand); color: #fff; font-size: .7rem; font-weight: 800; border-radius: 999px; padding: .05rem .5rem; margin-left: .35rem; vertical-align: middle; }
        .rank-score { flex: none; text-align: right; font-weight: 800; }
        .rank-score small { display: block; color: var(--muted); font-weight: 600; }

        .empty {
            background: var(--surface); border: 2px dashed var(--line); border-radius: 14px;
            padding: 2rem 1rem; text-align: center; color: var(--muted);
        }
        .empty i { font-size: 2.5rem; }

        @media (min-width: 576px) {
            .page { padding: 2.5rem 0 3rem; }
            .podium { gap: 1rem; }
            .pod { padding: 1rem .75rem; }
            .pod-name { font-size: 1rem; }
            .avatar { width: 52px; height: 52px; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="page">
    <div class="container narrow">

        <div class="back-link">
            <a th:href="@{/student/my-results}"><i class="bi bi-arrow-left me-1"></i>Back to results</a>
        </div>

        <h1 th:text="${exam.title}">Exam title</h1>
        <p class="sub">Top scores for this exam. Ties go to whoever submitted first.</p>

        <!-- Your own place -->
        <div class="my-rank" th:if="${myRank != null}">
            Your rank: <strong th:text="|#${myRank}|">#5</strong>
            <span class="text-muted" th:text="|of ${participants}|">of 23</span>
        </div>

        <!-- Podium -->
        <div class="podium" th:unless="${#lists.isEmpty(podium)}">
            <div class="pod" th:each="p : ${podium}"
                 th:classappend="|rank-${p.rank} ${p.me ? 'me' : ''}|">
                <i class="bi bi-trophy-fill medal" aria-hidden="true"></i>
                <span class="place" th:text="${p.rank}">1</span>
                <span class="visually-hidden" th:text="|Place ${p.rank}|">Place 1</span>

                <img th:if="${p.profilePicUrl != null}" th:src="@{${p.profilePicUrl}}" alt="" class="avatar">
                <svg th:if="${p.profilePicUrl == null}" xmlns="http://www.w3.org/2000/svg" width="40" height="40"
                     fill="currentColor" class="avatar" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                </svg>

                <span class="pod-name">
                    <span th:text="${p.name}">Student</span>
                    <span class="you" th:if="${p.me}">You</span>
                </span>
                <span class="pod-score" th:text="${#numbers.formatDecimal(p.percentage, 1, 1) + '%'}">90.0%</span>
                <span class="pod-raw" th:text="|${p.score} / ${p.total}|">18 / 20</span>
            </div>
        </div>

        <!-- Rank 4 and below -->
        <ul class="rank-list" th:unless="${#lists.isEmpty(others)}">
            <li class="rank-row" th:each="o : ${others}" th:classappend="${o.me} ? 'me'">
                <span class="rank-no" th:text="${o.rank}">4</span>
                <img th:if="${o.profilePicUrl != null}" th:src="@{${o.profilePicUrl}}" alt="" class="avatar">
                <svg th:if="${o.profilePicUrl == null}" xmlns="http://www.w3.org/2000/svg" width="40" height="40"
                     fill="currentColor" class="avatar" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                </svg>
                <span class="rank-name">
                    <span th:text="${o.name}">Student</span>
                    <span class="you" th:if="${o.me}">You</span>
                </span>
                <span class="rank-score">
                    <span th:text="${#numbers.formatDecimal(o.percentage, 1, 1) + '%'}">70.0%</span>
                    <small th:text="|${o.score} / ${o.total}|">14 / 20</small>
                </span>
            </li>
        </ul>

        <div class="empty" th:if="${#lists.isEmpty(podium)}">
            <i class="bi bi-trophy"></i>
            <p class="mb-0 mt-2">No one has taken this exam yet. Be the first on the board.</p>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
