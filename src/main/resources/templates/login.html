<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Online Exam System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --ink: #101828;
            --muted: #475467;
            --paper: #f3f5f9;
            --surface: #ffffff;
            --brand: #3b3fd8;
            --brand-dark: #2b2fb0;
            --pencil: #ffc93c;
            --line: #d9deea;
        }

        body {
            font-family: "Source Sans 3", system-ui, sans-serif;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
        }
        h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.02em; font-weight: 800; }
        :focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }

        .auth-wrap { padding: 4rem 0; }

        .auth-card {
            background: var(--surface);
            border: 2px solid var(--ink);
            border-radius: 16px;
            box-shadow: 8px 8px 0 var(--pencil);
            padding: 2rem;
            max-width: 440px;
            margin-inline: auto;
        }
        .auth-card h1 { font-size: 2rem; margin-bottom: .25rem; }
        .auth-card .sub { color: var(--muted); margin-bottom: 1.5rem; }

        .form-label { font-weight: 600; }
        .form-control {
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: .7rem .9rem;
        }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(59, 63, 216, .2); }

        .input-group .form-control { border-right: 0; border-radius: 10px 0 0 10px; }
        .toggle-pw {
            border: 1.5px solid var(--line); border-left: 0; background: var(--surface);
            border-radius: 0 10px 10px 0; color: var(--muted); padding-inline: .9rem;
        }
        .toggle-pw:hover { color: var(--ink); }
        .input-group:focus-within .form-control,
        .input-group:focus-within .toggle-pw { border-color: var(--brand); }

        .btn-brand {
            background: var(--brand); color: #fff; font-weight: 600;
            padding: .8rem 1.2rem; border-radius: 10px; border: 0;
        }
        .btn-brand:hover { background: var(--brand-dark); color: #fff; }

        .alert { border-radius: 10px; font-weight: 600; }
        .auth-foot { text-align: center; margin: 1.5rem 0 0; color: var(--muted); }
        .auth-foot a, .back-link a { color: var(--brand); font-weight: 600; }
        .back-link { max-width: 440px; margin: 0 auto 1rem; }
        .back-link a { text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<main class="auth-wrap">
    <div class="container">

        <div class="back-link">
            <a th:href="@{/}"><i class="bi bi-arrow-left me-1"></i>Back to home</a>
        </div>

        <div class="auth-card">
            <h1>Log in</h1>
            <p class="sub">Use your username and password to continue.</p>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle-fill me-2"></i>Wrong username or password. Check both and try again.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="status">
                <i class="bi bi-check-circle-fill me-2"></i>You have been logged out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="togglePw"
                                aria-label="Show password" aria-pressed="false">
                            <i class="bi bi-eye" id="togglePwIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand w-100">Log in</button>
            </form>

            <p class="auth-foot">
                New student? <a th:href="@{/register}">Create an account</a>
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var input = document.getElementById('password');
        var btn = document.getElementById('togglePw');
        var icon = document.getElementById('togglePwIcon');
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            btn.setAttribute('aria-pressed', show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    })();
</script>
</body>
</html>
